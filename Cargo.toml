[workspace]
resolver = "2"
members = [
    "src-tauri",
    "cadenza-cli",
    "proto",
    "i18n",
    "skills-core",
]

[workspace.package]
# Placeholder: `main` is never a published version. The real version is
# stamped from the git tag by CI (see .github/workflows/release.yml and
# docs/RELEASING.md). `0.0.0` means "unpublished / dev build".
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/williammb/cadenza"
authors = ["Cadenza contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
fs2 = "0.4"
dirs = "6"
fluent-bundle = "0.16"
intl-memoizer = "0.5"
unic-langid = "0.9"
include_dir = "0.7"
sys-locale = "0.3"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
vte = "0.15"
interprocess = { version = "2", features = ["tokio"] }
rand = "0.10"
base64 = "0.22"
sha2 = "0.11"
regex = "1"
globset = "0.4"
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "json",
] }
keyring = "4"
keyring-core = "1"
# Jira HTTP/data layer (Slice 3). reqwest 0.13 + url 2 + tokio-util 0.7 + rustls
# 0.23 are ALL already resolved transitively (via tauri-plugin-updater);
# promoting them to direct deps adds ZERO new crates → zero new licenses. We use
# the exact same reqwest feature set the updater already pulls —
# `rustls-no-provider` (reuses the existing `ring`-backed rustls stack; the
# `rustls` feature would instead add aws-lc-rs + quinn). `json` is also already
# enabled transitively.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
url = "2"
tokio-util = "0.7"
# `rustls-no-provider` requires the process to install a crypto provider before
# the first Client is built. We install the `ring` provider (already in the lock
# via rustls' `ring` feature — zero new crates). default-features=false avoids
# pulling aws-lc-rs as a second provider.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Windows-only IPC/auth hardening (Item 3): resolve the current user's SID and
# build a restrictive DACL/security descriptor for the auth token file and the
# named pipe. windows-sys 0.61 is already in the lock tree (pulled by
# interprocess 2.4), so pinning the same major adds ZERO new crates. widestring
# is likewise already resolved transitively (via interprocess). Both are
# MIT/Apache-2.0 — deny-compatible.
windows-sys = "0.61"
widestring = "1"
# Diagnostics export (Item 7): zip the rolling logs + env info into a single
# support bundle. default-features=false drops bzip2/zstd/lzma/aes/deflate64;
# the `deflate-flate2` feature reuses `flate2` (already in the tree via `png`),
# so this adds no new compression backends. zip 4.x is MIT — deny-compatible.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

cadenza-proto = { path = "proto" }
cadenza-i18n = { path = "i18n" }
skills-core = { path = "skills-core" }

[profile.dev]
opt-level = 0
debug = 1

# Tuned for CI build time over peak runtime perf: this is an early-stage
# desktop app where a ~30 min release build is the real cost, not a few
# percent of binary speed. lto=false + codegen-units=16 parallelize codegen
# and drop the serial link-time pass. Revisit (lto="thin", codegen-units=1)
# if/when runtime perf of the shipped binary actually matters.
[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
